[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "usb2xxx"
version = "0.1.2"
description = "USB2Box device SDK and tools"
requires-python = ">=3.11"

[project.optional-dependencies]
usb = ["pyusb==1.3.1"]
gui = ["PySide6==6.9.3"]
mcp = ["mcp==1.20.0", "pydantic==2.12.5"]
numpy = ["numpy==2.3.4"]

[project.scripts]
usb2xxx = "usb2xxx.cli:main"
usb2xxx-gui = "usb2xxx.gui:main"
usb2xxx-mcp = "usb2xxx.mcp_server:main"

[tool.setuptools.packages.find]
where = ["pc"]
